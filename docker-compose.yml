services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_local_only
      POSTGRES_DB: aegis
    volumes: [algorhythm-021-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U aegis"], interval: 3s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis_local_only@db:5432/aegis
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis_local_only@db:5432/aegis
      ENVIRONMENT: ${ENVIRONMENT:-021_SANDBOX}
      BROKER_021_ACCESS_TOKEN: ${BROKER_021_ACCESS_TOKEN:-}
      BROKER_021_ACCOUNT_ID: ${BROKER_021_ACCOUNT_ID:-1}
      BROKER_021_DEFAULT_SYMBOL: ${BROKER_021_DEFAULT_SYMBOL:-RELIANCE}
      # Itemised charge schedule override (optional; defaults live in config.py).
      BROKERAGE_RATE: ${BROKERAGE_RATE:-0.0003}
      BROKERAGE_CAP: ${BROKERAGE_CAP:-20}
      STT_RATE: ${STT_RATE:-0.00025}
      EXCHANGE_TXN_RATE: ${EXCHANGE_TXN_RATE:-0.0000297}
      SEBI_RATE: ${SEBI_RATE:-0.000001}
      IPFT_RATE: ${IPFT_RATE:-0.000001}
      STAMP_DUTY_RATE: ${STAMP_DUTY_RATE:-0.00003}
      GST_RATE: ${GST_RATE:-0.18}
      GST_INCLUDES_STAMP_DUTY: ${GST_INCLUDES_STAMP_DUTY:-true}
      CHARGE_SEGMENT: ${CHARGE_SEGMENT:-EQUITY_INTRADAY}
      # The 021 sandbox feed stays open outside NSE hours; widen the session
      # window so strategies can execute whenever the feed is live.
      MARKET_OPEN_IST: ${MARKET_OPEN_IST:-00:00}
      MARKET_CLOSE_IST: ${MARKET_CLOSE_IST:-23:59}
      TIME_ENTRY_WINDOW_SECONDS: ${TIME_ENTRY_WINDOW_SECONDS:-86340}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis_local_only@db:5432/aegis
      ENVIRONMENT: ${ENVIRONMENT:-021_SANDBOX}
      BROKER_021_ACCESS_TOKEN: ${BROKER_021_ACCESS_TOKEN:-}
      BROKER_021_ACCOUNT_ID: ${BROKER_021_ACCOUNT_ID:-1}
      BROKER_021_DEFAULT_SYMBOL: ${BROKER_021_DEFAULT_SYMBOL:-RELIANCE}
      BROKERAGE_RATE: ${BROKERAGE_RATE:-0.0003}
      BROKERAGE_CAP: ${BROKERAGE_CAP:-20}
      STT_RATE: ${STT_RATE:-0.00025}
      EXCHANGE_TXN_RATE: ${EXCHANGE_TXN_RATE:-0.0000297}
      SEBI_RATE: ${SEBI_RATE:-0.000001}
      IPFT_RATE: ${IPFT_RATE:-0.000001}
      STAMP_DUTY_RATE: ${STAMP_DUTY_RATE:-0.00003}
      GST_RATE: ${GST_RATE:-0.18}
      GST_INCLUDES_STAMP_DUTY: ${GST_INCLUDES_STAMP_DUTY:-true}
      CHARGE_SEGMENT: ${CHARGE_SEGMENT:-EQUITY_INTRADAY}
      MARKET_OPEN_IST: ${MARKET_OPEN_IST:-00:00}
      MARKET_CLOSE_IST: ${MARKET_CLOSE_IST:-23:59}
      TIME_ENTRY_WINDOW_SECONDS: ${TIME_ENTRY_WINDOW_SECONDS:-86340}
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  algorhythm-021-db:
