services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_local_only
      POSTGRES_DB: aegis
    volumes: [algorhythm-021-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U aegis"], interval: 3s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis_local_only@db:5432/aegis
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis_local_only@db:5432/aegis
      ENVIRONMENT: ${ENVIRONMENT:-021_SANDBOX}
      BROKER_021_ACCESS_TOKEN: ${BROKER_021_ACCESS_TOKEN:-}
      BROKER_021_ACCOUNT_ID: ${BROKER_021_ACCOUNT_ID:-1}
      BROKER_021_DEFAULT_SYMBOL: ${BROKER_021_DEFAULT_SYMBOL:-RELIANCE}
      ASSUMED_CHARGE_RATE: ${ASSUMED_CHARGE_RATE:-0.0005}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://aegis:aegis_local_only@db:5432/aegis
      ENVIRONMENT: ${ENVIRONMENT:-021_SANDBOX}
      BROKER_021_ACCESS_TOKEN: ${BROKER_021_ACCESS_TOKEN:-}
      BROKER_021_ACCOUNT_ID: ${BROKER_021_ACCOUNT_ID:-1}
      BROKER_021_DEFAULT_SYMBOL: ${BROKER_021_DEFAULT_SYMBOL:-RELIANCE}
      ASSUMED_CHARGE_RATE: ${ASSUMED_CHARGE_RATE:-0.0005}
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:80"]
volumes:
  algorhythm-021-db:
