server { listen 80; root /usr/share/nginx/html; index index.html;
  # Re-resolve the api service through Docker's embedded DNS so a restart that
  # recreates the api container with a new IP cannot leave a stale upstream.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location / { try_files $uri /index.html; }
  location /api/ {
    set $upstream http://api:8000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
